# Render Workflow service for the blog queue (2026-11-05)
#
# This file documents the *workflow* service only. The existing web service
# (alphadome.onrender.com) was created in the dashboard and is not described here, so do not
# assume a Blueprint created from this file replaces it.
#
# The values below mirror the dashboard fields: Language Node, Branch main, Root Directory
# empty, Region Frankfurt (where the other four services already run).
#
# Why the build command installs the SDK separately: `@renderinc/sdk` is deliberately NOT a
# dependency of the web app. Adding it to package.json without regenerating package-lock.json
# would break `npm ci` in .github/workflows/blog-automation.yml, and the web service has no use
# for a workflow SDK. Installing it here keeps both true.
services:
  - type: workflow
    name: alphadome-blog
    runtime: node
    region: frankfurt
    branch: main
    plan: starter
    buildCommand: npm install && npm install @renderinc/sdk@^1.7.0
    # The dashboard default is `node index.js`, which crashes: there is no index.js in the repo
    # root (that is a stale `main` field in package.json; the web service runs `node server.js`).
    startCommand: node workflows/index.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SITE_URL
        value: https://alphadome.onrender.com
      # The workflow ends by asking the site to re-read `blog_posts`, because the site serves
      # /blog/:slug from its own disk and only rebuilds it at boot. Sent as an x-admin-key
      # header, never a query string. Optional: without it the pages are still durable and the
      # next deploy shows them.
      - key: ADMIN_PASS
        sync: false
      # The generation budget exists because generation normally runs inside a tenant's HTTP
      # request. A task run may last two hours, so it can be spent here instead of truncated.
      - key: BLOG_RUN_BUDGET_MS
        value: "600000"
      - key: BLOG_ANGLE_DELAY_MS
        value: "1200"

  # ─── The clock that actually keeps time (2026-11-06) ──────────────────────
  #
  # GitHub's scheduler has been 4–7 hours late on every scheduled run this repo has ever had
  # (asked for 02:00 UTC, ran at 06:30–09:00), and after moving the cron to every 15 minutes it
  # produced no run at all for 3½ hours. That is not a workflow-file problem — the file parses,
  # the cron is valid — it is the public scheduler being unreliable for this repo.
  #
  # So the schedule lives on Render, next to the service it triggers. This job runs a script
  # that calls the Render API directly (`scripts/trigger_blog_queue.mjs`, no dependencies, so no
  # build step), which means the only credential involved is a Render key that never leaves
  # Render. GitHub can keep its copy as a redundant backup, or be reverted to daily.
  - type: cron_job
    name: alphadome-blog-cron
    runtime: node
    region: frankfurt
    branch: main
    # 2026-11-12: daily, 02:00 UTC. GitHub's schedule was removed because it fired hours
    # late and then not at all; this runs on the same platform as the site it serves.
    # Raise the frequency only after a week of clean runs.
    schedule: "0 2 * * *"
    buildCommand: echo "no build required"
    # 2026-11-12: runs the queue directly instead of asking a Render Workflow to do it.
    # The Workflow service (alphadome-blog) may never have been created — render.yaml
    # describes it, it does not create it — and a trigger that 404s is silent failure.
    # This command needs only the web app's own code and database credentials.
    startCommand: node scripts/blog_queue.mjs --apply --limit $BLOG_RUN_LIMIT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_URL
        value: https://alphadome.onrender.com
      # Generation normally runs inside a tenant's HTTP request; a cron run has no such
      # ceiling, so give the writer room instead of truncating angles.
      - key: BLOG_RUN_BUDGET_MS
        value: "600000"
      # How many offers each nightly run writes. 10 is roughly an hour of work.
      - key: BLOG_RUN_LIMIT
        value: "10"

