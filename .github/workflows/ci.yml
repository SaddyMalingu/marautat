name: CI

# Why this exists (2026-11-12): Render was deploying whatever landed on main, or
# nothing at all, because the only scheduled workflow in this repo is the blog clock.
# Two commits sat undeployed for twenty minutes while a third got through, and the
# only way to find out which was live was to ask the server for its commit.
#
# So: every push is checked here first, and main is only deployed when the checks
# pass. Set RENDER_DEPLOY_HOOK to the deploy-hook URL from the Render service
# (Settings -> Deploy Hook), and turn Render's own Auto-Deploy OFF — this workflow
# becomes the thing that decides.
#
# The suites chosen are the offline ones: no database, no network, no provider key.
# A test that needs a secret cannot gate a deploy, because it would fail for the
# wrong reason on a fork and pass for the wrong reason on main.
#
# 2026-11-12: test_blog_queue and test_blog_jobs were removed from this list for
# exactly that reason — they reach for Supabase configuration, so on a clean runner
# they fail on the environment rather than on the change. They still run by hand
# (`npm run test:blogqueue`, `test:blogjobs`) before a blog-engine change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `cache: 'npm'` on purpose. It is an optimisation, and when it cannot resolve the
      # lockfile it fails during setup — before any step of ours runs — which is a red run that
      # says nothing about the commit. Every CI run in this repo failed in 3-4 s on 2026-11-12/13
      # and the cause was not visible anywhere in the job log.
      - name: Environment
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then echo "lockfile: present ($(wc -c < package-lock.json) bytes)"; else echo "lockfile: MISSING"; fi
          echo "commit: $GITHUB_SHA"
      - name: Install
        # npm install, not npm ci, on purpose: Render's build command is `npm install`, and its
        # logs already show packages being added and removed against a drifted lockfile. `npm ci`
        # would fail the gate for a reason that has nothing to do with the commit being tested.
        run: npm install --no-audit --no-fund --loglevel=error
      - name: server.js parses as an ES module
        # `node --check server.js` is enough: package.json sets "type": "module", so Node parses
        # it as ESM. The previous form (`--input-type=module --check < server.js`) depended on
        # stdin behaviour that is not part of --check's contract.
        run: node --check server.js
      - name: Digital Drops rules and routes
        run: node scripts/test_digital_drops.mjs
      - name: Digital Drops end to end
        run: node scripts/test_drops_flow.mjs
      - name: Blog quality gate
        run: node scripts/test_blog_quality.mjs
      - name: Site hygiene
        run: node scripts/test_site_hygiene.mjs
      - name: Landing page
        run: node scripts/test_landing_site.mjs
      - name: Scan to Pay
        run: node scripts/test_scan_pay.mjs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set. Add it in Settings -> Secrets and variables -> Actions, or deploy from the Render dashboard."
            exit 1
          fi
          # The hook deploys the latest commit on the branch it was created for.
          curl --fail-with-body --silent --show-error --request POST "$HOOK"
          echo "Deploy triggered for $GITHUB_SHA"
