name: Daily Blog Generation

# The clock. Render Workflows has no native schedule trigger — runs start from the API, the SDK,
# the CLI or the dashboard — so the schedule lives in git, which is also where it is reviewable.
#
# Two ways to spend this slot, and both are wired below:
#   1. If RENDER_API_KEY is set, the job asks the Workflow service to run its `blogQueue` task.
#      That buys parallel per-offer runs, automatic retries per step, and a two-hour ceiling
#      instead of the ninety seconds a tenant's HTTP request allows.
#   2. Otherwise it runs the queue directly on the runner, which is enough to get pages written
#      and needs no Render service at all.
on:
  schedule:
    # 02:00 UTC daily. Free AI tiers rate-limit per minute, so one nightly pass is deliberate.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max offers to generate this run'
        required: false
        default: '3'

jobs:
  generate-blogs:
    runs-on: ubuntu-latest

    # GitHub does not expose the `secrets` context to a step-level `if:`, so the two facts the
    # steps need are computed here. `HAS_DB_CREDS` is a boolean, not a credential: it lets the
    # fallback decide whether it can run at all without lifting the service-role key into every
    # step's environment.
    # The workflow slug and task name, as registered in the Render dashboard. This is the
    # one string that must match the deployed workflow: the service was created as
    # `alphadome-blog` (service id wfl-dbm4ea56e07s73b49qn0), so the task is
    # `alphadome-blog/blogQueue`. A mismatch is a 404 from the Render API, not a 401.
    #
    # Override without editing this file by setting the repository variable
    # BLOG_WORKFLOW_TASK (Settings → Secrets and variables → Actions → Variables). That
    # matters if the workflow is ever renamed: a rename should not need a commit here.
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BLOG_WORKFLOW_TASK: ${{ vars.BLOG_WORKFLOW_TASK || 'alphadome-blog/blogQueue' }}
      HAS_DB_CREDS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Trigger the Render Workflow
        id: workflow
        if: env.RENDER_API_KEY != ''
        env:
          LIMIT: ${{ github.event.inputs.limit || '3' }}
        run: |
          # `blogQueue` plans from the same tables the portal reads, then fans out one chained
          # run per offer. `blogQueue` is registered by workflows/index.js.
          #
          # A failure here fails the job on purpose. Falling back to the runner on a trigger
          # error would need database credentials in GitHub, and a workflow that quietly does
          # the work somewhere else is how a red night becomes a mystery.
          echo "Triggering $BLOG_WORKFLOW_TASK with limit=$LIMIT"
          if ! curl --fail-with-body --silent --show-error \
            --request POST 'https://api.render.com/v1/task-runs' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"task\":\"$BLOG_WORKFLOW_TASK\",\"input\":[{\"limit\":$LIMIT}]}"; then
            echo "::error::Trigger rejected. A 404 means the task slug does not match the deployed"
            echo "::error::workflow — check Workflow Slug in the dashboard, or set the repository"
            echo "::error::variable BLOG_WORKFLOW_TASK. A 401 means RENDER_API_KEY is wrong or revoked."
            exit 1
          fi

      # Sequential, on the runner: slower, but it writes the same blog_posts rows the site
      # restores from. Only runs when there is no workflow to trigger — and only when the
      # credentials for it actually exist, so it cannot fail with a confusing auth error.
      - name: Generate on the runner (fallback)
        if: env.RENDER_API_KEY == '' && env.HAS_DB_CREDS == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          SITE_URL: https://alphadome.onrender.com
          # No HTTP request to bound here, so give the writer room instead of truncating angles.
          BLOG_RUN_BUDGET_MS: '600000'
        run: node scripts/blog_queue.mjs --apply --limit ${{ github.event.inputs.limit || '3' }}

      # Neither path is available. Say which one is missing instead of finishing green over
      # nothing — the previous version of this job reported success while writing zero pages,
      # which is why nobody noticed for weeks.
      - name: Nothing to do (no credentials)
        if: env.RENDER_API_KEY == '' && env.HAS_DB_CREDS != 'true'
        run: |
          echo "::error::No way to generate: set RENDER_API_KEY (to trigger the workflow) or SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (to run here)."
          exit 1

      - name: Report results
        if: always()
        run: echo "Blog queue run finished"


